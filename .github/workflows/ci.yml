name: CI

# Unit tests, vet, and lint on every PR. No kernel, no root, no BPF
# compilation here — the real-kernel integration test runs locally via
# `sudo make integration` (see README).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: go test + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...

  lint:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Lint with a current Go: staticcheck releases track Go releases,
      # and the pinned release below needs a newer toolchain than the
      # go.mod minimum the test job verifies.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
